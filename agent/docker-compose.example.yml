# Run on an always-on machine in the vCenter management network, outside the cluster.
# Secrets go to an .env file next to this one, with permissions 600.
services:
  ha-vmware-agent:
    build: .
    restart: unless-stopped
    # Wake on LAN broadcasts need the host network.
    network_mode: host
    env_file: .env
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - agent-data:/data

volumes:
  agent-data:
