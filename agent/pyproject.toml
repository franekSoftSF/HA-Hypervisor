[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-hypervisor-agent"
description = "Agent connecting vCenter, ESXi and server BMCs to Home Assistant over MQTT"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "paho-mqtt>=2.1,<3",
    "pyvmomi>=9.0,<10",
    "pyghmi>=1.6,<2",
    "PyYAML>=6,<7",
    "requests>=2.32,<3",
]

[project.scripts]
ha-hypervisor-agent = "ha_hypervisor_agent.__main__:main"

[tool.setuptools]
packages = ["ha_hypervisor_agent"]

[tool.setuptools.dynamic]
version = { attr = "ha_hypervisor_agent.__version__" }
